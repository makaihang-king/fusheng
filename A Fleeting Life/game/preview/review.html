<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>浮生 · 动作与结局</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d0;color:#293f48;font:16px/1.65 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:21px;margin:30px 0 14px}p{margin:8px 0 18px}a{color:#365b65}label{display:inline-flex;align-items:center;gap:12px}select{padding:8px;border:1px solid #8a9a94;background:#f4efdf;color:inherit;border-radius:6px}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{margin:0;border:1px solid #bac0ae;background:#f4efdf;border-radius:9px;overflow:hidden}.card video{width:100%;aspect-ratio:16/9;display:block;background:#263b43}.card figcaption{padding:12px 16px}.card small{display:block;color:#60756e}.actions{grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.actions .card{padding:16px;text-align:center}.actions img{display:block;width:96px;height:96px;margin:0 auto;image-rendering:pixelated}.actions figcaption{padding:6px 0 0;font-size:14px}.hint{font-size:14px;color:#60756e}@media(max-width:650px){section{grid-template-columns:1fr}main{padding:22px 16px}}
</style></head><body><main><h1>浮生 · 小满的动作与结局</h1>
<p>同一张脸、同一套骨架。游戏使用像素动作，结局使用同源平滑人物。<a href="./">回到游戏</a></p>
<h2>动作链</h2><p class="hint" id="action-status">正在读取当前人物动作。每个动作保持 48 × 48 的逻辑画幅。</p><section id="actions" class="actions"></section>
<h2>七个结局</h2><p><label>小满服装 <select id="skin"><option value="base">白衬衫</option><option value="waistJacket">校服外套系腰</option><option value="raincoat">雨衣</option><option value="namelessNotebook">无名作业本</option></select></label></p>
<p class="hint">每片 12 秒；游戏播完后显示 2 秒结尾文字。可逐个播放检查人物、剧情和画风。</p><p id="film-status" class="hint" role="status">正在读取本轮成片记录。</p><section id="films"></section>
</main><script>
const actionLabels={idle:'待机',runStart:'起跑',run:'奔跑',jump:'单跳',doubleJump:'二段跳',dive:'急坠',slide:'滑铲',slideRecovery:'起身',land:'落地',hurt:'受伤',sit:'坐姿',climb:'攀爬',break:'击碎',sleep:'趴睡',celebrate:'庆祝'};
const pictures=[];
function showActions(model){for(const [key,{frames:count,fps}] of Object.entries(model.actions||{})){const name=actionLabels[key]||key;const el=document.createElement('figure');el.className='card';const img=document.createElement('img');img.alt=name;el.append(img);const caption=document.createElement('figcaption');caption.textContent=name;el.append(caption);document.querySelector('#actions').append(el);const frames=Array.from({length:count},(_,i)=>{const p=new Image;p.src='../assets/resources/art/pixel/character/hd/'+key+'/'+String(i).padStart(2,'0')+'.png?v='+model.sourceHash;return p;});pictures.push({img,frames,fps});}document.querySelector('#action-status').textContent=pictures.length?`当前人物共 ${pictures.length} 种动作。奔跑支撑脚向后蹬地，游戏步频跟随实际跑速；滑铲与起身保持原骨长。`:'人物动作正在重生，完成后刷新本页。';}
function tick(t){for(const x of pictures){const p=x.frames[Math.floor(t*x.fps/1000)%x.frames.length];if(p.complete&&p.naturalWidth&&x.img.src!==p.src)x.img.src=p.src;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
const films={morning:['明天的早自习','闹钟响起，回到晨光里的教室。'],backrow:['教室后排','走向最后一排，在亮窗旁坐下。'],outside:['跑道之外','走过普通街道，在三岔路口第一次停步。'],desk:['小一号的课桌','三年后回到小学，抚过旧课桌的刻痕。'],secondGrade:['回到二年级','看见年幼的自己趴桌睡着，安静离开。'],runaway:['跑出去','砖墙缓落，穿过缝隙，来到普通小街。'],wall:['墙的另一边','踩窗台攀上墙头，看见另一条同样的跑道。']};
for(const[id,[title,description]]of Object.entries(films)){const el=document.createElement('figure');el.className='card';const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.dataset.id=id;el.append(v);const c=document.createElement('figcaption');c.textContent=title;const s=document.createElement('small');s.textContent=description;c.append(s);el.append(c);document.querySelector('#films').append(el);}
let completed=new Map(),deliveryReady=false;
function update(){const skin=document.querySelector('#skin').value;let count=0;for(const v of document.querySelectorAll('video')){v.pause();const record=completed.get(skin+'/'+v.dataset.id);if(record){v.src='../'+record.path+'?v='+record.sha256;count++;}else{v.removeAttribute('src');v.load();}}document.querySelector('#film-status').textContent=count===7?(deliveryReady?'当前服装的 7 部本轮成片已就绪。':'当前服装的 7 部新成片已生成，整体验收进行中。'):`当前服装已生成 ${count}/7 部与当前人物一致的影片；旧步态影片不展示。`}
document.querySelector('#skin').addEventListener('change',update);
async function loadJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('审阅记录尚未就绪');return r.json();}
async function sourceHash(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('人物版本尚未就绪');return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await r.arrayBuffer())),x=>x.toString(16).padStart(2,'0')).join('');}
Promise.all([loadJson('../xiaoman-model.json'),loadJson('../build/qa/ending-films/generation-manifest.json'),loadJson('../build/qa/ending-films/generation-status.json'),sourceHash('../scripts/xiaoman_rig.py'),sourceHash('../scripts/generate-ending-films.py')]).then(([model,rows,status,rigHash,generatorHash])=>{if(model.sourceHash===rigHash)showActions(model);else document.querySelector('#action-status').textContent='人物动作正在重生，完成后刷新本页。';deliveryReady=status.fullReady===true;completed=new Map(rows.filter(r=>r.generation==='Qwen game-style reference + MiniMax H3 dynamic environment + fixed game xiaoman_rig.py actor'&&r.decoded&&r.seconds===12&&r.rigSha256===rigHash&&r.generatorSha256===generatorHash).map(r=>[r.skin+'/'+r.id,r]));update();}).catch(()=>{document.querySelector('#action-status').textContent='人物动作记录尚未就绪，稍后刷新重试。';update();});
</script></body></html>
