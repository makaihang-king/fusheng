<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>浮生 · 学堂</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face{font-family:FusionPixel;src:url('../assets/resources/fonts/FusionPixel.ttf')}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;color:#c6bda6;font-family:FusionPixel,monospace;background:#344941}
    body{height:100dvh;overscroll-behavior:none}
    #shell{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden}
    canvas{display:block;image-rendering:pixelated;touch-action:none;outline:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    #backdrop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    #stage{position:absolute;left:50%;top:50%;width:480px;height:270px;transform:translate(-50%,-50%);overflow:hidden;isolation:isolate}
    #game{width:100%;height:100%}
    #error{display:none;position:fixed;inset:10%;z-index:10;padding:24px;background:#202b38;white-space:pre-wrap;font:14px sans-serif;color:#ffd6ba}
    button{font:inherit}
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="stage"><canvas id="game" width="480" height="270" tabindex="0" aria-label="浮生第一章游戏，轻点或空格跳跃，下滑或方向下键滑铲与急坠"></canvas></div>
  </main>
  <div id="error"></div>
  <script src="../build/web/game.js"></script>
  <script src="host.js"></script>
</body>
</html>
